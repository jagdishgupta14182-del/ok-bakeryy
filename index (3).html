<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>OK Bakery Management</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:linear-gradient(135deg,#1a0a00,#3d1a00,#1a0a00);min-height:100vh;font-family:'Segoe UI',sans-serif;color:#fff;}
input,select,textarea{background:rgba(255,255,255,0.08);border:1px solid rgba(255,140,0,0.4);border-radius:10px;padding:10px 12px;color:#fff;font-size:14px;width:100%;margin-bottom:8px;outline:none;font-family:'Segoe UI',sans-serif;}
select{background:#2a1000;}
select option{background:#2a1000;}
input::placeholder,textarea::placeholder{color:#888;}
button{cursor:pointer;font-family:'Segoe UI',sans-serif;}
.toggle-btn{display:flex;background:rgba(255,255,255,0.08);border-radius:25px;padding:3px;margin-bottom:12px;width:fit-content;}
.toggle-btn button{padding:6px 18px;border-radius:22px;border:none;font-size:13px;font-weight:700;transition:all 0.2s;}
.toggle-btn button.active{background:linear-gradient(135deg,#ff8c00,#ff6000);color:#fff;}
.toggle-btn button.inactive{background:transparent;color:#888;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

const SB="https://bqnkzthuahfjjhggiswd.supabase.co/rest/v1";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxbmt6dGh1YWhmampoZ2dpc3dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NzAyNTgsImV4cCI6MjA5MTU0NjI1OH0.80Bs9Bq3srliKDH0nPb_F_Fptfd9D_ci9RM8u5UDtmQ";
const HD={"apikey":KEY,"Authorization":`Bearer ${KEY}`,"Content-Type":"application/json"};

const dbGet=async(t,q="")=>{try{const r=await fetch(`${SB}/${t}?order=created_at.desc${q}`,{headers:HD});if(!r.ok)return[];return await r.json();}catch{return[];}};
const dbPost=async(t,b)=>{try{const r=await fetch(`${SB}/${t}`,{method:"POST",headers:{...HD,"Prefer":"return=representation"},body:JSON.stringify(b)});const txt=await r.text();if(!r.ok)return null;try{return JSON.parse(txt);}catch{return true;}}catch{return null;}};
const dbPatch=async(t,id,b)=>{try{const r=await fetch(`${SB}/${t}?id=eq.${id}`,{method:"PATCH",headers:HD,body:JSON.stringify(b)});return r.ok;}catch{return false;}};

const fd=()=>new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"2-digit",year:"numeric"});
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
const rupee=(n)=>`₹${parseFloat(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const genInvNo=()=>`INV-${Date.now().toString().slice(-6)}`;

const DEF_RECIPES=[
  {name:"Bread / Bun",name_hi:"ब्रेड / बन",icon:"🍞",base_qty:50,base_unit:"pcs",ingredients:[{name:"Maida",qty:2,unit:"kg"},{name:"Yeast",qty:0.05,unit:"kg"},{name:"Sugar",qty:0.1,unit:"kg"},{name:"Salt",qty:0.02,unit:"kg"},{name:"Oil",qty:0.1,unit:"L"},{name:"Water",qty:1,unit:"L"}]},
  {name:"Cake / Pastry",name_hi:"केक / पेस्ट्री",icon:"🎂",base_qty:10,base_unit:"pcs",ingredients:[{name:"Maida",qty:0.5,unit:"kg"},{name:"Egg",qty:4,unit:"pcs"},{name:"Sugar",qty:0.3,unit:"kg"},{name:"Butter",qty:0.2,unit:"kg"},{name:"Baking Powder",qty:0.01,unit:"kg"},{name:"Milk",qty:0.2,unit:"L"}]},
  {name:"Biscuit / Cookies",name_hi:"बिस्कुट / कुकीज़",icon:"🍪",base_qty:100,base_unit:"pcs",ingredients:[{name:"Maida",qty:1,unit:"kg"},{name:"Sugar",qty:0.4,unit:"kg"},{name:"Butter",qty:0.3,unit:"kg"},{name:"Baking Soda",qty:0.005,unit:"kg"},{name:"Vanilla Essence",qty:0.01,unit:"L"}]},
  {name:"Namkeen / Snacks",name_hi:"नमकीन / स्नैक्स",icon:"🥜",base_qty:1,base_unit:"kg",ingredients:[{name:"Besan",qty:0.5,unit:"kg"},{name:"Maida",qty:0.3,unit:"kg"},{name:"Oil",qty:0.2,unit:"L"},{name:"Salt",qty:0.02,unit:"kg"},{name:"Spices",qty:0.01,unit:"kg"}]},
];

const S={
  card:{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,140,0,0.2)",borderRadius:"16px",padding:"16px",marginBottom:"12px"},
  btn:(c)=>({padding:"11px 16px",borderRadius:"10px",border:"none",background:c||"linear-gradient(135deg,#ff8c00,#ff6000)",color:"#fff",fontWeight:"700",fontSize:"14px",cursor:"pointer",width:"100%"}),
  bsm:(c)=>({padding:"7px 12px",borderRadius:"8px",border:"none",background:c||"linear-gradient(135deg,#ff8c00,#ff6000)",color:"#fff",fontWeight:"700",fontSize:"12px",cursor:"pointer",whiteSpace:"nowrap"}),
  bout:{padding:"7px 12px",borderRadius:"8px",border:"1px solid #ff8c00",background:"transparent",color:"#ff8c00",fontWeight:"600",fontSize:"13px",cursor:"pointer"},
  lbl:{fontSize:"12px",color:"#ffb347",marginBottom:"3px",display:"block",fontWeight:"600"},
  tab:(a)=>({padding:"8px 11px",borderRadius:"8px 8px 0 0",border:"none",background:a?"rgba(255,140,0,0.25)":"transparent",color:a?"#ff8c00":"#999",fontWeight:a?"700":"500",fontSize:"12px",cursor:"pointer",whiteSpace:"nowrap",borderBottom:a?"2px solid #ff8c00":"2px solid transparent"}),
  bdg:(c)=>({display:"inline-block",padding:"2px 8px",borderRadius:"20px",fontSize:"11px",fontWeight:"700",background:c==="g"?"rgba(0,200,100,0.2)":c==="r"?"rgba(255,60,60,0.2)":c==="b"?"rgba(41,128,185,0.2)":c==="y"?"rgba(255,165,0,0.2)":"rgba(255,140,0,0.2)",color:c==="g"?"#00c864":c==="r"?"#ff4040":c==="b"?"#3498db":c==="y"?"#ffa500":"#ffb347"}),
  stat:(c)=>({background:`rgba(${c},0.1)`,border:`1px solid rgba(${c},0.3)`,borderRadius:"12px",padding:"12px",flex:1,textAlign:"center",minWidth:"80px"}),
};

function App(){
  const [screen,setScreen]=useState("login");
  const [pin,setPin]=useState("");
  const [pinErr,setPinErr]=useState("");
  const [tab,setTab]=useState("dashboard");
  const [msg,setMsg]=useState(null);
  const [busy,setBusy]=useState(false);
  const [subScreen,setSubScreen]=useState(null);
  const [accTab,setAccTab]=useState("sal");

  const [recipes,setRecipes]=useState([]);
  const [prods,setProds]=useState([]);
  const [sales,setSales]=useState([]);
  const [purch,setPurch]=useState([]);
  const [exps,setExps]=useState([]);
  const [parties,setParties]=useState([]);
  const [invoices,setInvoices]=useState([]);
  const [stock,setStock]=useState([]);
  const [items,setItems]=useState([]);
  const [priceHistory,setPriceHistory]=useState([]);

  // Invoice form - Vyapar style
  const [invForm,setInvForm]=useState({
    party_id:"",party_name:"",party_address:"",party_gst:"",
    invoice_no:genInvNo(),date:today(),
    items:[],discount:0,tax_rate:0,shipping:0,notes:"",
    status:"unpaid",payment_type:"credit"
  });
  const [invItem,setInvItem]=useState({name:"",qty:"",rate:"",unit:"pcs",discount_pct:0});
  const [showPriceHistory,setShowPriceHistory]=useState(false);
  const [itemHistory,setItemHistory]=useState([]);

  // Item master form
  const [itemForm,setItemForm]=useState({name:"",unit:"pcs",default_rate:"",hsn_code:""});

  // Party form
  const [partyForm,setPartyForm]=useState({name:"",type:"customer",phone:"",address:"",gst_no:"",balance:0});

  // Stock
  const [stockForm,setStockForm]=useState({name:"",type:"raw",quantity:"",unit:"kg",min_qty:"",rate:""});
  const [stockAdj,setStockAdj]=useState({id:"",qty:"",type:"in",note:""});

  // Production
  const [pf,setPf]=useState({rid:"",qty:"",note:""});
  const [cIngs,setCIngs]=useState([]);

  // Sale/Purchase/Expense quick forms
  const [sf,setSf]=useState({item:"",items:[],sItem:{name:"",qty:"",rate:"",unit:"pcs"},qty:"",rate:"",customer:"",customer_id:"",shipping:0,payment_type:"cash"});
  const [pf2sel,setPf2sel]=useState({vendor_id:"",vendor_name:""});
  const [pf2,setPf2]=useState({item:"",items:[],pItem:{name:"",qty:"",rate:"",unit:"kg"},qty:"",unit:"kg",rate:"",vendor:"",shipping:0,payment_type:"cash"});
  const [ef,setEf]=useState({desc:"",amount:"",category:"Rent"});

  // Party statement
  const [stmtParty,setStmtParty]=useState(null);

  const toast=(m,e=false)=>{setMsg({m,e});setTimeout(()=>setMsg(null),3500);};
  const doSave=async(fn)=>{setBusy(true);try{await fn();}catch(e){toast("❌ Error: "+e.message,true);}setBusy(false);};

  const load=async()=>{
    const [r,p,s,pu,ex,pa,inv,st,it,ph]=await Promise.all([
      dbGet("recipes"),dbGet("productions"),dbGet("sales"),dbGet("purchases"),
      dbGet("expenses"),dbGet("parties"),dbGet("invoices"),dbGet("stock"),
      dbGet("items"),dbGet("sale_price_history")
    ]);
    if(r.length===0){for(const rec of DEF_RECIPES)await dbPost("recipes",rec);setRecipes(await dbGet("recipes"));}
    else setRecipes(r);
    setProds(p);setSales(s);setPurch(pu);setExps(ex);setParties(pa);
    setInvoices(inv);setStock(st);setItems(it);setPriceHistory(ph);
  };

  const login=async()=>{
    if(pin==="1234"){setScreen("staff");setPin("");setPinErr("");await load();}
    else if(pin==="9999"){setScreen("master");setTab("dashboard");setPin("");setPinErr("");await load();}
    else{setPinErr("❌ गलत PIN!");setPin("");}
  };
  const logout=()=>{setScreen("login");setPin("");setPinErr("");setSubScreen(null);};

  useEffect(()=>{
    if(!pf.rid||!pf.qty){setCIngs([]);return;}
    const r=recipes.find(x=>x.id===parseInt(pf.rid));
    if(!r)return;
    const m=parseFloat(pf.qty)/r.base_qty;
    setCIngs((r.ingredients||[]).map(i=>({...i,cq:(i.qty*m).toFixed(3).replace(/\.?0+$/,"")})));
  },[pf.rid,pf.qty,recipes]);

  // When party selected in invoice, auto-fill
  const selectPartyForInv=(partyId)=>{
    const p=parties.find(x=>x.id===parseInt(partyId));
    setInvForm(f=>({...f,party_id:partyId,party_name:p?p.name:"",party_address:p?p.address||"":"",party_gst:p?p.gst_no||"":""}));
  };

  // When item selected in invoice row
  const selectItemForRow=(itemName)=>{
    const it=items.find(x=>x.name===itemName);
    // Get last price for this customer
    const lastPrice=priceHistory.filter(h=>h.item_name===itemName&&h.party_name===invForm.party_name).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
    const rate=lastPrice?lastPrice.rate:(it?it.default_rate:"");
    // Get last 5 prices for this item+customer
    const hist=priceHistory.filter(h=>h.item_name===itemName&&(invForm.party_name?h.party_name===invForm.party_name:true)).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,5);
    setItemHistory(hist);
    setInvItem(f=>({...f,name:itemName,unit:it?it.unit:"pcs",rate:rate?String(rate):""}));
    if(hist.length>0)setShowPriceHistory(true);
  };

  // Invoice calculations
  const calcInv=(itms,disc,tax,ship)=>{
    const sub=itms.reduce((s,i)=>{
      const amt=parseFloat(i.qty||0)*parseFloat(i.rate||0);
      const discAmt=amt*(parseFloat(i.discount_pct||0)/100);
      return s+(amt-discAmt);
    },0);
    const afterDisc=sub-parseFloat(disc||0);
    const taxAmt=afterDisc*(parseFloat(tax||0)/100);
    const total=afterDisc+taxAmt+parseFloat(ship||0);
    return{sub,taxAmt,total};
  };

  const addInvItem=()=>{
    if(!invItem.name||!invItem.qty||!invItem.rate)return toast("Item, Qty और Rate जरूरी!",true);
    const amt=parseFloat(invItem.qty)*parseFloat(invItem.rate);
    const discAmt=amt*(parseFloat(invItem.discount_pct||0)/100);
    setInvForm(f=>({...f,items:[...f.items,{...invItem,amount:amt-discAmt}]}));
    setInvItem({name:"",qty:"",rate:"",unit:"pcs",discount_pct:0});
    setShowPriceHistory(false);
    setItemHistory([]);
  };

  const saveInvoice=()=>doSave(async()=>{
    if(!invForm.party_name)return toast("Party name जरूरी है!",true);
    if(invForm.items.length===0)return toast("कम से कम 1 item जोड़ें!",true);
    const{sub,taxAmt,total}=calcInv(invForm.items,invForm.discount,invForm.tax_rate,invForm.shipping);
    const payload={
      invoice_no:invForm.invoice_no,
      date:invForm.date,
      party_id:invForm.party_id?parseInt(invForm.party_id):null,
      party_name:invForm.party_name,
      party_address:invForm.party_address||"",
      party_gst:invForm.party_gst||"",
      items:invForm.items,
      subtotal:sub,
      discount:parseFloat(invForm.discount||0),
      tax_rate:parseFloat(invForm.tax_rate||0),
      tax_amount:taxAmt,
      shipping:parseFloat(invForm.shipping||0),
      total,
      notes:invForm.notes||"",
      status:invForm.payment_type==="cash"?"paid":"unpaid",
      payment_type:invForm.payment_type
    };
    const result=await dbPost("invoices",payload);
    if(result){
      // Save price history for each item
      for(const item of invForm.items){
        await dbPost("sale_price_history",{
          party_id:invForm.party_id?parseInt(invForm.party_id):null,
          party_name:invForm.party_name,
          item_name:item.name,
          rate:parseFloat(item.rate),
          date:invForm.date
        });
      }
      // Update party balance if credit
      if(invForm.party_id&&invForm.payment_type==="credit"){
        const party=parties.find(p=>p.id===parseInt(invForm.party_id));
        if(party)await dbPatch("parties",invForm.party_id,{balance:(parseFloat(party.balance||0)+total)});
      }
      setInvForm({party_id:"",party_name:"",party_address:"",party_gst:"",invoice_no:genInvNo(),date:today(),items:[],discount:0,tax_rate:0,shipping:0,notes:"",status:"unpaid",payment_type:"credit"});
      setSubScreen(null);await load();toast("✅ Invoice बन गई!");
    }else toast("❌ Save नहीं हुआ!",true);
  });

  const markPaid=async(inv)=>{
    await dbPatch("invoices",inv.id,{status:"paid"});
    if(inv.party_id){
      const party=parties.find(p=>p.id===inv.party_id);
      if(party)await dbPatch("parties",inv.party_id,{balance:Math.max(0,parseFloat(party.balance||0)-parseFloat(inv.total||0))});
    }
    await load();toast("✅ Paid!");
  };

  const saveItem=()=>doSave(async()=>{
    if(!itemForm.name)return toast("Item name जरूरी!",true);
    const ok=await dbPost("items",itemForm);
    if(ok){setItemForm({name:"",unit:"pcs",default_rate:"",hsn_code:""});await load();toast("✅ Item जुड़ गया!");}
    else toast("❌ Save नहीं हुआ!",true);
  });

  const saveParty=()=>doSave(async()=>{
    if(!partyForm.name)return toast("नाम जरूरी है!",true);
    let ok;
    if(partyForm.id){
      ok=await dbPatch("parties",partyForm.id,{name:partyForm.name,type:partyForm.type,phone:partyForm.phone,address:partyForm.address,gst_no:partyForm.gst_no,balance:parseFloat(partyForm.balance||0)});
    } else {
      ok=await dbPost("parties",{name:partyForm.name,type:partyForm.type,phone:partyForm.phone||"",address:partyForm.address||"",gst_no:partyForm.gst_no||"",balance:parseFloat(partyForm.balance||0)});
    }
    if(ok){setPartyForm({name:"",type:"customer",phone:"",address:"",gst_no:"",balance:0});setSubScreen(null);await load();toast(partyForm.id?"✅ Party update हो गई!":"✅ Party जुड़ गई!");}
    else toast("❌ Save नहीं हुआ!",true);
  });

  const getFullStatement=(party)=>{
    const partyInv=invoices.filter(i=>i.party_id===party.id||i.party_name===party.name);
    const partySales=sales.filter(s=>s.customer===party.name);
    const partyPurch=purch.filter(p=>p.vendor===party.name);
    const allTxns=[
      ...partyInv.map(i=>({
        id:"inv"+i.id,date:i.date,type:"Invoice",desc:i.invoice_no,
        amount:parseFloat(i.total||0),payment:i.payment_type,status:i.status,
        items:i.items||[],shipping:i.shipping||0,discount:i.discount||0,
        tax_rate:i.tax_rate||0,tax_amount:i.tax_amount||0,
        cr:i.status==="unpaid"?parseFloat(i.total||0):0,
        dr:i.status==="paid"?parseFloat(i.total||0):0,
        rawObj:i
      })),
      ...partySales.map(s=>({
        id:"sal"+s.id,date:s.date,type:"Sale",desc:s.item,
        amount:parseFloat(s.total||0),payment:s.payment_type,status:s.payment_type,
        items:s.items||[{name:s.item,qty:"-",rate:"-",unit:""}],
        shipping:s.shipping||0,
        cr:s.payment_type==="credit"?parseFloat(s.total||0):0,
        dr:s.payment_type==="cash"?parseFloat(s.total||0):0,
        rawObj:s
      })),
      ...partyPurch.map(p=>({
        id:"pur"+p.id,date:p.date,type:"Purchase",desc:p.item,
        amount:parseFloat(p.total||0),payment:p.payment_type,status:p.payment_type,
        items:p.items||[{name:p.item,qty:"-",rate:"-",unit:""}],
        shipping:p.shipping||0,
        cr:0,dr:parseFloat(p.total||0),
        rawObj:p
      })),
    ].sort((a,b)=>new Date(b.date)-new Date(a.date));
    return allTxns;
  };

  const shareOnWhatsApp=(party,allTxns,balance)=>{
    const unpaidTxns=allTxns.filter(t=>t.cr>0);
    let msg=`🥐 *OK BAKERY*
`;
    msg+=`📋 *${party.name} का Statement*
`;
    msg+=`━━━━━━━━━━━━━━━━

`;
    unpaidTxns.forEach(t=>{
      msg+=`📅 ${t.date} | ${t.type}
`;
      if(t.items&&t.items.length>0){
        t.items.forEach(it=>{
          if(it.name)msg+=`  • ${it.name}: ${it.qty} × ₹${it.rate} = ₹${(parseFloat(it.qty||0)*parseFloat(it.rate||0)).toFixed(0)}
`;
        });
      }
      msg+=`  💰 Total: ₹${t.amount.toFixed(2)}

`;
    });
    msg+=`━━━━━━━━━━━━━━━━
`;
    msg+=`⏳ *बकाया: ₹${parseFloat(balance).toFixed(2)}*
`;
    msg+=`
कृपया जल्द भुगतान करें 🙏`;
    const url=`https://wa.me/?text=${encodeURIComponent(msg)}`;
    window.open(url,"_blank");
  };

  const saveStock=()=>doSave(async()=>{
    if(!stockForm.name||!stockForm.quantity)return toast("नाम और Qty जरूरी!",true);
    const ok=await dbPost("stock",stockForm);
    if(ok){setStockForm({name:"",type:"raw",quantity:"",unit:"kg",min_qty:"",rate:""});setSubScreen(null);await load();toast("✅ Stock जुड़ गया!");}
    else toast("❌ Save नहीं हुआ!",true);
  });

  const adjustStock=()=>doSave(async()=>{
    if(!stockAdj.id||!stockAdj.qty)return toast("Item और Qty जरूरी!",true);
    const item=stock.find(s=>s.id===parseInt(stockAdj.id));
    if(!item)return;
    const newQty=stockAdj.type==="in"?parseFloat(item.quantity||0)+parseFloat(stockAdj.qty):parseFloat(item.quantity||0)-parseFloat(stockAdj.qty);
    await dbPatch("stock",stockAdj.id,{quantity:Math.max(0,newQty)});
    await dbPost("stock_transactions",{stock_id:parseInt(stockAdj.id),name:item.name,type:stockAdj.type,quantity:parseFloat(stockAdj.qty),reference:stockAdj.note,date:fd()});
    setStockAdj({id:"",qty:"",type:"in",note:""});await load();toast("✅ Stock update!");
  });

  const addProd=()=>doSave(async()=>{
    if(!pf.rid||!pf.qty)return toast("Product और Quantity भरें!",true);
    const r=recipes.find(x=>x.id===parseInt(pf.rid));
    const ok=await dbPost("productions",{date:fd(),time:new Date().toLocaleTimeString("hi-IN",{hour:"2-digit",minute:"2-digit"}),product:r.name,product_hi:r.name_hi,icon:r.icon,qty:pf.qty,unit:r.base_unit,ings:cIngs,note:pf.note});
    if(ok){setPf({rid:"",qty:"",note:""});await load();toast("✅ Production दर्ज!");}
    else toast("❌ Save नहीं हुआ!",true);
  });

  const addSale=()=>doSave(async()=>{
    const saleItems=(sf.items||[]).filter(it=>it.name&&it.qty&&it.rate);
    if(saleItems.length===0)return toast("कम से कम 1 item भरें (नाम, qty, rate)!",true);
    if(!sf.customer)return toast("Customer नाम जरूरी है!",true);
    const itemsTotal=saleItems.reduce((s,it)=>s+(parseFloat(it.qty)*parseFloat(it.rate)),0);
    const total=itemsTotal+parseFloat(sf.shipping||0);
    const payload={
      date:fd(),
      item:saleItems.map(i=>i.name).join(", "),
      items:saleItems,
      customer:sf.customer,
      shipping:parseFloat(sf.shipping||0),
      total:total,
      payment_type:sf.payment_type
    };
    console.log("Saving sale:", payload);
    const ok=await dbPost("sales",payload);
    console.log("Sale result:", ok);
    if(ok){

              <div style={{flex:1}}><label style={S.lbl}>GST No.</label><input placeholder="GST" value={invForm.party_gst} onChange={e=>setInvForm(f=>({...f,party_gst:e.target.value}))}/></div>

            <div style={{display:"flex",gap:"8px"}}>

              {/* Item select with saved items */}
              <label style={S.lbl}>Item नाम *</label>
              <select value={invItem.name} onChange={e=>selectItemForRow(e.target.value)} style={{marginBottom:"4px"}}>

              </select>
              <input placeholder="या नाम लिखें" value={invItem.name} onChange={e=>setInvItem(f=>({...f,name:e.target.value}))} style={{marginBottom:"8px"}}/>

              {showPriceHistory&&itemHistory.length>0&&<div style={{background:"rgba(41,128,185,0.15)",border:"1px solid rgba(41,128,185,0.4)",borderRadius:"10px",padding:"10px",marginBottom:"8px"}}>

                <div style={{flex:1}}><label style={S.lbl}>Unit</label><select value={invItem.unit} onChange={e=>setInvItem(f=>({...f,unit:e.target.value}))}><option>pcs</option><option>kg</option><option>g</option><option>dozen</option><option>box</option></select></div>

              <div style={{display:"flex",gap:"6px"}}>
                <div style={{flex:1}}><label style={S.lbl}>Rate ₹ *</label><input type="number" placeholder="Rate" value={invItem.rate} onChange={e=>setInvItem(f=>({...f,rate:e.target.value}))}/></div>

          {/* Charges */}

              {parseFloat(invForm.shipping||0)>0&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px"}}><span style={{color:"#ccc"}}>🚚 Shipping</span><span>₹{parseFloat(invForm.shipping).toFixed(2)}</span></div>}

    // NEW PARTY

          </div>
          <div style={S.card}>

            <label style={S.lbl}>Address</label><input value={partyForm.address} onChange={e=>setPartyForm(f=>({...f,address:e.target.value}))}/>
            <label style={S.lbl}>GST No.</label><input value={partyForm.gst_no} onChange={e=>setPartyForm(f=>({...f,gst_no:e.target.value}))}/>
            <label style={S.lbl}>Opening Balance ₹</label><input type="number" placeholder="0" value={partyForm.balance} onChange={e=>setPartyForm(f=>({...f,balance:e.target.value}))}/>
            <button style={S.btn()} onClick={saveParty} disabled={busy}>{busy?"⏳ Saving...":"✅ Save"}</button>
          </div>
        </div>
      </div>

    // ITEM MASTER
    if(subScreen==="itemMaster")return(
      <div style={{minHeight:"100vh",paddingBottom:"30px"}}><Msg/><Hdr sub="ITEM MASTER"/>
        <div style={{padding:"14px"}}>
          <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px"}}>
            <button style={S.bsm("rgba(255,255,255,0.1)")} onClick={()=>setSubScreen(null)}>← वापस</button>
            <div style={{fontWeight:"800",color:"#ff8c00"}}>📦 Item Master</div>

              <div style={{flex:1}}><label style={S.lbl}>Default Rate ₹</label><input type="number" placeholder="0" value={itemForm.default_rate} onChange={e=>setItemForm(f=>({...f,default_rate:e.target.value}))}/></div>

            <button style={S.btn()} onClick={saveItem} disabled={busy}>{busy?"⏳ Saving...":"✅ Item Save"}</button>
          </div>
          <div style={S.card}>
            <div style={{fontWeight:"700",color:"#ffb347",marginBottom:"10px"}}>📋 Saved Items ({items.length})</div>
            {items.length===0?<div style={{color:"#666",textAlign:"center",padding:"20px"}}>कोई item नहीं</div>

    // STOCK SCREEN
    if(subScreen==="newStock")return(
      <div style={{minHeight:"100vh",paddingBottom:"30px"}}><Msg/><Hdr sub="STOCK"/>
        <div style={{padding:"14px"}}>
          <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px"}}>

            <div style={{fontWeight:"800",color:"#ff8c00"}}>📦 Stock</div>

          <div style={S.card}>
            <div style={{fontWeight:"700",color:"#ffb347",marginBottom:"10px"}}>🔄 Stock Adjust</div>
            <select value={stockAdj.id} onChange={e=>setStockAdj(f=>({...f,id:e.target.value}))}>
              <option value="">-- Item चुनें --</option>
              {stock.map(s=><option key={s.id} value={s.id}>{s.name} ({s.quantity} {s.unit})</option>)}
            </select>
            <select value={stockAdj.type} onChange={e=>setStockAdj(f=>({...f,type:e.target.value}))}>

            </select>
            <input type="number" placeholder="Qty" value={stockAdj.qty} onChange={e=>setStockAdj(f=>({...f,qty:e.target.value}))}/>
            <input placeholder="Note" value={stockAdj.note} onChange={e=>setStockAdj(f=>({...f,note:e.target.value}))}/>

    // MAIN TABS
    return(
      <div style={{minHeight:"100vh",paddingBottom:"30px"}}><Msg/><Hdr sub="MASTER APP"/>

        {lowStock.length>0&&<div style={{background:"rgba(255,60,60,0.15)",borderBottom:"2px solid #ff4040",padding:"10px 16px",display:"flex",gap:"8px"}}>

              <div style={{fontWeight:"700",color:"#ff4040",marginBottom:"8px"}}>🔴 Low Stock</div>

                      <tr>
                        <td colSpan="6" style={{padding:"6px"}}>
                          <button style={{...S.bsm("rgba(255,140,0,0.15)"),color:"#ff8c00",border:"1px dashed rgba(255,140,0,0.4)",width:"100%",padding:"8px"}} onClick={()=>setPf2(f=>({...f,items:[...(f.items||[]),{name:"",qty:"",rate:"",unit:"kg"}]}))}>+ ADD ROW</button>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                {/* Shipping */}
                <div style={{display:"flex",gap:"8px",alignItems:"center",marginBottom:"8px"}}>
                  <label style={{...S.lbl,marginBottom:0,whiteSpace:"nowrap"}}>🚚 Shipping ₹</label>
                  <input style={{marginBottom:0,flex:1}} type="number" placeholder="0" value={pf2.shipping} onChange={e=>setPf2(f=>({...f,shipping:e.target.value}))}/>
                </div>

                {/* Total */}
                {(pf2.items||[]).filter(it=>it.qty&&it.rate).length>0&&<div style={{background:"rgba(255,140,0,0.08)",borderRadius:"10px",padding:"12px",marginBottom:"10px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px",fontSize:"12px",color:"#ccc"}}><span>Items Total</span><span>{rupee((pf2.items||[]).reduce((s,it)=>s+(parseFloat(it.qty||0)*parseFloat(it.rate||0)),0))}</span></div>
                  {parseFloat(pf2.shipping||0)>0&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px",fontSize:"12px",color:"#ccc"}}><span>🚚 Shipping</span><span>{rupee(pf2.shipping)}</span></div>}
                  <div style={{display:"flex",justifyContent:"space-between",borderTop:"1px solid rgba(255,255,255,0.1)",paddingTop:"8px",marginTop:"4px"}}><b style={{fontSize:"15px"}}>Total</b><b style={{color:"#ff8c00",fontSize:"20px"}}>{rupee((pf2.items||[]).reduce((s,it)=>s+(parseFloat(it.qty||0)*parseFloat(it.rate||0)),0)+parseFloat(pf2.shipping||0))}</b></div>
                </div>}

                <button style={S.btn()} onClick={addPurch} disabled={busy}>{busy?"⏳ Saving...":"✅ Purchase Save करें"}</button>
              </div>

              {/* Purchase List */}
              <div style={S.card}><div style={{display:"flex",justifyContent:"space-between"}}><span>Total Purchase</span><b style={{color:"#ff8c00",fontSize:"18px"}}>{rupee(totP)}</b></div></div>
              {purch.map(p=><div key={p.id} style={S.card}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:"700",fontSize:"14px"}}>{p.vendor||"Vendor"}</div>
                    <div style={{display:"flex",gap:"4px",margin:"4px 0"}}>
                      <span style={S.bdg(p.payment_type==="cash"?"g":"y")}>{p.payment_type==="cash"?"💵 Cash":"🤝 Credit"}</span>
                      <span style={{fontSize:"11px",color:"#888"}}>{p.date}</span>
                    </div>
                    {p.items&&p.items.length>0&&p.items[0].name?
                      <div style={{background:"rgba(255,140,0,0.06)",borderRadius:"8px",padding:"8px",marginTop:"6px"}}>
                        <table style={{width:"100%",fontSize:"12px",borderCollapse:"collapse"}}>
                          <thead><tr style={{color:"#888"}}>
                            <td style={{padding:"2px 4px"}}>Item</td>
                            <td style={{padding:"2px 4px",textAlign:"center"}}>Qty</td>
                            <td style={{padding:"2px 4px",textAlign:"center"}}>Rate</td>
                            <td style={{padding:"2px 4px",textAlign:"right"}}>Amt</td>
                          </tr></thead>
                          <tbody>{p.items.map((it,i)=>it.name?<tr key={i} style={{borderTop:"1px solid rgba(255,255,255,0.05)"}}>
                            <td style={{padding:"3px 4px",color:"#fff"}}>{it.name}</td>
                            <td style={{padding:"3px 4px",textAlign:"center",color:"#ccc"}}>{it.qty} {it.unit||""}</td>
                            <td style={{padding:"3px 4px",textAlign:"center",color:"#ccc"}}>₹{it.rate}</td>
                            <td style={{padding:"3px 4px",textAlign:"right",color:"#ff8c00",fontWeight:"700"}}>₹{(parseFloat(it.qty||0)*parseFloat(it.rate||0)).toFixed(0)}</td>
                          </tr>:null)}</tbody>
                        </table>
                        {parseFloat(p.shipping||0)>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:"11px",color:"#888",marginTop:"4px"}}><span>🚚 Shipping</span><span>₹{p.shipping}</span></div>}
                      </div>
                    :<div style={{fontSize:"12px",color:"#888"}}>{p.item}</div>}
                  </div>
                  <b style={{color:"#ff8c00",fontSize:"16px",marginLeft:"8px"}}>{rupee(p.total)}</b>
                </div>
              </div>)}
            </div>}

            {accTab==="exp"&&<div>
              <div style={S.card}>
                <div style={{fontWeight:"800",color:"#ff4040",marginBottom:"12px"}}>➕ Expense</div>
                <select value={ef.category} onChange={e=>setEf(f=>({...f,category:e.target.value}))}>
                  {["Rent","Salary","Electricity","Transport","Maintenance","Marketing","Other"].map(c=><option key={c}>{c}</option>)}
                </select>
                <input placeholder="Description *" value={ef.desc} onChange={e=>setEf(f=>({...f,desc:e.target.value}))}/>
                <input type="number" placeholder="Amount ₹ *" value={ef.amount} onChange={e=>setEf(f=>({...f,amount:e.target.value}))}/>
                <button style={S.btn("linear-gradient(135deg,#c0392b,#922b21)")} onClick={addExp} disabled={busy}>{busy?"⏳...":"✅ Save"}</button>
              </div>
              <div style={S.card}><div style={{display:"flex",justifyContent:"space-between"}}><span>Total Expense</span><b style={{color:"#ff4040",fontSize:"18px"}}>{rupee(totE)}</b></div></div>
              {exps.map(e=><div key={e.id} style={S.card}><div style={{display:"flex",justifyContent:"space-between"}}><div><span style={S.bdg("r")}>{e.category}</span><b style={{marginLeft:"6px"}}>{e.desc_text}</b></div><b style={{color:"#ff4040"}}>{rupee(e.amount)}</b></div></div>)}
            </div>}
          </div>}

          {tab==="reports"&&<div>
            <div style={{fontWeight:"800",color:"#ff8c00",fontSize:"16px",marginBottom:"12px"}}>📋 Reports</div>
            <div style={{...S.card,background:"rgba(0,200,100,0.07)",border:"1px solid rgba(0,200,100,0.25)"}}>
              <div style={{color:"#00c864",fontWeight:"700",marginBottom:"8px"}}>📊 Cash Flow</div>
              {[["Invoice Sales",totInv,"g"],["Direct Sales",totS,"g"],["Purchase",-totP,"r"],["Expenses",-totE,"r"]].map(([l,v,c])=><div key={l} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}><span style={{color:"#ccc"}}>{l}</span><span style={{color:c==="g"?"#00c864":"#ff4040",fontWeight:"700"}}>{c==="g"?"+":"-"}{rupee(Math.abs(v))}</span></div>)}
              <div style={{display:"flex",justifyContent:"space-between",paddingTop:"8px",borderTop:"1px solid rgba(255,255,255,0.1)",marginTop:"4px"}}><b>Net Profit</b><b style={{fontSize:"20px",color:net>=0?"#00c864":"#ff4040"}}>{net>=0?"+":""}{rupee(net)}</b></div>
            </div>
            <div style={S.card}>
              <div style={{fontWeight:"700",color:"#ffb347",marginBottom:"10px"}}>👥 Party Ledger (बकाया)</div>
              {parties.filter(p=>parseFloat(p.balance||0)>0).length===0?<div style={{color:"#666",fontSize:"13px"}}>कोई बकाया नहीं ✅</div>
                :parties.filter(p=>parseFloat(p.balance||0)>0).map(p=><div key={p.id} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                  <div>
                    <div style={{fontWeight:"600"}}>{p.name}</div>
                    <span style={S.bdg(p.type==="customer"?"b":"o")}>{p.type}</span>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{color:"#ff4040",fontWeight:"700"}}>{rupee(p.balance)}</div>
                    <button style={{...S.bsm("linear-gradient(135deg,#2980b9,#1a5276)"),fontSize:"10px",padding:"2px 6px",marginTop:"2px"}} onClick={()=>{setStmtParty(p);setSubScreen("statement");}}>📋</button>
                  </div>
                </div>)}
            </div>
            <div style={S.card}>
              <div style={{fontWeight:"700",color:"#ffb347",marginBottom:"10px"}}>📋 GST Report</div>
              {invoices.filter(i=>parseFloat(i.tax_amount||0)>0).length===0?<div style={{color:"#666",fontSize:"13px"}}>कोई GST invoice नहीं</div>
                :invoices.filter(i=>parseFloat(i.tax_amount||0)>0).map(inv=><div key={inv.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                  <div><div style={{fontSize:"13px"}}>{inv.party_name}</div><div style={{fontSize:"11px",color:"#888"}}>{inv.invoice_no} • {inv.tax_rate}%</div></div>
                  <span style={{color:"#ffb347"}}>{rupee(inv.tax_amount)}</span>
                </div>)}
              <div style={{borderTop:"1px solid rgba(255,255,255,0.1)",paddingTop:"8px",marginTop:"8px",display:"flex",justifyContent:"space-between"}}><b>Total GST</b><b style={{color:"#ffb347"}}>{rupee(invoices.reduce((s,i)=>s+parseFloat(i.tax_amount||0),0))}</b></div>
            </div>
            <div style={S.card}>
              <div style={{fontWeight:"700",color:"#ffb347",marginBottom:"10px"}}>💸 Expense Breakdown</div>
              {["Rent","Salary","Electricity","Transport","Maintenance","Marketing","Other"].map(cat=>{
                const t=exps.filter(e=>e.category===cat).reduce((s,e)=>s+parseFloat(e.amount||0),0);
                if(!t)return null;
                return <div key={cat} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}><span style={{color:"#ccc"}}>{cat}</span><span style={{color:"#ff4040",fontWeight:"600"}}>{rupee(t)}</span></div>;
              })}
            </div>
          </div>}
        </div>
      </div>
    );
  }
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
